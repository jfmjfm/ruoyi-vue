<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenLayers WMS 展示 — repa:usle_swat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  <style>
    html,body{height:100%;margin:0}
    #map{width:100%;height:100vh}
    .toolbar{position:absolute;left:8px;top:8px;z-index:1000;background:rgba(255,255,255,0.95);padding:8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
    .toolbar label{display:block;font-size:13px;margin-bottom:6px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="toolbar">
    <label><input id="visible" type="checkbox" checked> 显示 repa:usle_swat</label>
    <label>图层不透明度 <input id="opacity" type="range" min="0" max="1" step="0.01" value="1"></label>
    <button id="fit">缩放至图层范围</button>
    <button id="testWMS">测试WMS连接</button>
    
    <!-- 年份动画控制 -->
    <div style="margin-top:10px; padding-top:10px; border-top:1px solid #ccc;">
      <label>年份: <span id="yearDisplay">2009</span></label>
      <input id="yearSlider" type="range" min="2009" max="2018" value="2009" step="1" style="width:100%;">
      <div style="margin-top:5px;">
        <button id="playPause">播放动画</button>
        <button id="resetYear">重置</button>
      </div>
      <label>动画速度 (秒): <input id="animationSpeed" type="number" min="0.5" max="5" step="0.5" value="1" style="width:60px;"></label>
    </div>
    
    <div style="font-size:12px;margin-top:6px;color:#444"><code>EPSG:4326</code> 或在后端注册对应的投影。</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/proj4@2.8.0/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
  <script>
    // 等待 OpenLayers 库加载完成
    function waitForOpenLayers() {
      if (typeof ol !== 'undefined') {
        initializeMap();
      } else {
        // 如果 ol 还没有定义，等待一段时间后再次检查
        setTimeout(waitForOpenLayers, 100);
      }
    }

    function initializeMap() {
      // 从给定链接摘取的 bbox（已手动取出）：
      const bbox = [118.41667877737004, 44.452917782192465, 119.14330242199273, 45.23305354431723];

      // 使用标准的 EPSG:4326 投影（WGS84）
      const projection = ol.proj.get('EPSG:4326');

      // WMS 基础 URL
      const wmsUrl = 'http://172.16.124.1:31490/geoserver/repa/wms';

      // 动画控制变量
      let currentYear = 2009;
      let animationInterval = null;
      let isAnimating = false;

      // ImageWMS 源（使用 EPSG:4326）
      const wmsSource = new ol.source.ImageWMS({
        url: wmsUrl,
        params: {
          'FORMAT': 'image/png',
          'VERSION': '1.3.0',
          'LAYERS': 'repa:usle_swat',
          'CRS': 'EPSG:4326', // 使用EPSG:4326投影
          'STYLES': '',
          'viewparams': 'task:147-2-swat-295;year:' + currentYear // SQL视图参数
        },
        ratio: 1,
        serverType: 'geoserver'
      });

      const wmsLayer = new ol.layer.Image({
        source: wmsSource,
        opacity: 1
      });

      // 添加错误处理和调试信息
      wmsSource.on('imageloaderror', function(event) {
        console.error('WMS图层加载失败:', event);
        console.log('尝试的URL:', event.image.src);
        alert('WMS图层加载失败，请检查服务器连接或在浏览器开发者工具中查看网络错误');
      });

      wmsSource.on('imageloadend', function(event) {
        console.log('WMS图层加载成功');
      });

      // 添加 OpenStreetMap 作为底图
      const osmLayer = new ol.layer.Tile({
        source: new ol.source.OSM()
      });

      // 创建视图
      const view = new ol.View({
        projection: 'EPSG:4326', // 使用EPSG:4326投影
        center: [118.78, 44.84], // bbox的中心点，直接使用经纬度坐标
        zoom: 8
      });

      const map = new ol.Map({
        target: 'map',
        layers: [
          osmLayer,  // OpenStreetMap 底图
          wmsLayer   // WMS 图层（位于顶层）
        ],
        view: view
      });

      // fit 到 bbox（直接使用EPSG:4326坐标）
      function fitToBbox() {
        map.getView().fit(bbox, {size: map.getSize(), padding: [20,20,20,20]});
      }

      // 等待 map 渲染大小后再 fit
      map.once('rendercomplete', function() { fitToBbox(); });
      window.addEventListener('resize', function(){ fitToBbox(); });

      // UI 控件
      document.getElementById('visible').addEventListener('change', function(e){
        wmsLayer.setVisible(e.target.checked);
      });
      document.getElementById('opacity').addEventListener('input', function(e){
        wmsLayer.setOpacity(parseFloat(e.target.value));
      });
      document.getElementById('fit').addEventListener('click', function(){ fitToBbox(); });
      
      // 年份动画控制功能
      function updateYear(year) {
        currentYear = year;
        document.getElementById('yearDisplay').textContent = year;
        document.getElementById('yearSlider').value = year;
        
        // 更新WMS参数
        const params = wmsSource.getParams();
        params.viewparams = 'task:147-2-swat-295;year:' + year;
        wmsSource.updateParams(params);
        
        console.log('更新年份为:', year);
      }
      
      // 年份滑块控制
      document.getElementById('yearSlider').addEventListener('input', function(e) {
        if (!isAnimating) {
          updateYear(parseInt(e.target.value));
        }
      });
      
      // 播放/暂停动画
      document.getElementById('playPause').addEventListener('click', function() {
        if (isAnimating) {
          // 停止动画
          clearInterval(animationInterval);
          isAnimating = false;
          this.textContent = '播放动画';
          document.getElementById('yearSlider').disabled = false;
        } else {
          // 开始动画
          const speed = parseFloat(document.getElementById('animationSpeed').value) * 1000;
          isAnimating = true;
          this.textContent = '停止动画';
          document.getElementById('yearSlider').disabled = true;
          
          animationInterval = setInterval(function() {
            currentYear++;
            if (currentYear > 2018) {
              currentYear = 2009; // 循环播放
            }
            updateYear(currentYear);
          }, speed);
        }
      });
      
      // 重置年份
      document.getElementById('resetYear').addEventListener('click', function() {
        if (isAnimating) {
          clearInterval(animationInterval);
          isAnimating = false;
          document.getElementById('playPause').textContent = '播放动画';
          document.getElementById('yearSlider').disabled = false;
        }
        updateYear(2009);
      });
      
      // 测试WMS连接按钮
      document.getElementById('testWMS').addEventListener('click', function(){
        console.log('测试WMS连接...');
        
        // 创建一个备用的WMS源，使用EPSG:4326
        const testWmsSource = new ol.source.ImageWMS({
          url: wmsUrl,
          params: {
            'FORMAT': 'image/png',
            'VERSION': '1.1.0',
            'LAYERS': 'repa:usle_swat',
            'SRS': 'EPSG:4326',
            'STYLES': ''
          },
          ratio: 1,
          serverType: 'geoserver'
        });
        
        // 替换当前图层源
        wmsLayer.setSource(testWmsSource);
        
        // 更改地图视图为EPSG:4326
        const newView = new ol.View({
          projection: 'EPSG:4326',
          center: [118.78, 44.84],
          zoom: 8
        });
        map.setView(newView);
        
        // 重新适配到bbox
        setTimeout(function() {
          map.getView().fit(bbox, {size: map.getSize(), padding: [20,20,20,20]});
        }, 500);
        
        alert('已切换到EPSG:4326投影，如果图层仍不显示，请检查浏览器控制台的网络错误');
      });

      // 添加调试功能：显示当前WMS请求URL
      console.log('WMS服务器URL:', wmsUrl);
      console.log('WMS图层参数:', wmsSource.getParams());
      
      // 手动触发图层刷新
      setTimeout(function() {
        console.log('强制刷新WMS图层...');
        wmsSource.refresh();
      }, 2000);

      // 简单错误处理：如果服务器不支持所请求的投影，会在浏览器的网络面板看到 400/500 错误。
      // 若发生此类错误，建议：
      // 1) 联系 GeoServer 管理员为 EPSG:404000 注册正确的 proj4 定义；
      // 2) 或者尝试把 params 中的 'SRS' 改为 'EPSG:4326'（若服务端能自动重投影）；
      // 3) 把底图与 WMS 用同一个常见投影（如 EPSG:3857 或 EPSG:4326）。

    } // 结束 initializeMap()

    // 页面加载完成后开始检查 OpenLayers 是否可用
    document.addEventListener('DOMContentLoaded', waitForOpenLayers);
  </script>
</body>
</html>
